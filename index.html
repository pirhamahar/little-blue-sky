<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just For You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Welcome Screen -->

    <div class="welcome-screen" id="welcomeScreen">

        <div class="welcome-content">

            <p class="small-text">OCTOBER 7 • 2026</p>

            <h1>Hey You... ❤️</h1>

            <p class="intro">
                Someone very special was born on this day...
            </p>

            <p class="intro">
                And somehow, he became one of the most
                special people in my life.
            </p>

            <div class="countdown">

                <div>
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div>
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div>
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div>
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

            <div class="secret-message">

                <button onclick="revealMessage()">
                    A Secret For You 💌
                </button>

                <p id="hiddenMessage">
                    You are loved more than words can ever explain. ❤️
                </p>

            </div>

            <button id="musicButton" onclick="toggleMusic()">
                🎵 Play Our Song
            </button>

            <button onclick="startStory()">
                Open Your Surprise 🎁❤️
            </button>

        </div>

    </div>


    <!-- Website Pages -->

    <iframe
        id="contentFrame"
        src="story.html"
        style="display: none; width: 100%; height: 100vh; border: none;">
    </iframe>


    <!-- Background Music -->

    <audio id="birthdayMusic" loop>

        <source
            src="music/a-thousand-years.mp4"
            type="audio/mp4">

    </audio>


    <script src="script.js"></script>


    <script>

        function startStory() {

            createConfetti();

            document.getElementById("welcomeScreen").style.display = "none";

            document.getElementById("contentFrame").style.display = "block";

        }

    </script>

</body>

</html>
